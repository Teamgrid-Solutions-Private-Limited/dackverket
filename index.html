<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Setup</title>

    <link rel="stylesheet" href="./src/output.css" />
  </head>
 <body class="bg-gray-100">

    <div class="min-h-screen bg-black text-white">
<section class="relative min-h-screen flex items-center justify-center overflow-hidden">
  <!-- Background image -->
  <div
    class="absolute inset-0 bg-cover bg-center bg-no-repeat"
    style="background-image: url('/images/hero-bg.jpg');"
  ></div>

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/55"></div>

  <!-- Content -->
  <div class="relative z-10 container mx-auto text-center px-4 pt-20">
    
    <!-- Heading -->
    <h1
      class="hero-title font-bold text-white text-4xl md:text-6xl lg:text-7xl max-w-4xl mx-auto leading-tight opacity-0 translate-y-10"
    >
      Empowering Global Innovation Through Strategic Partnerships
    </h1>

    <!-- Subtitle -->
    <p
      class="hero-subtitle mt-6 text-lg md:text-xl text-white/70 max-w-2xl mx-auto opacity-0 translate-y-8"
    >
      We help businesses expand across regions, accelerate growth, and build lasting impact worldwide.
    </p>

    <!-- Buttons -->
    <div
      class="hero-buttons mt-10 flex flex-col sm:flex-row gap-4 justify-center opacity-0 translate-y-5"
    >
      <a
        href="#contact"
        class="bg-blue-600 text-white px-8 py-3.5 rounded-lg font-semibold text-base hover:brightness-110 transition shadow-lg"
      >
        Get Started
      </a>

      <a
        href="#about"
        class="border border-white/30 text-white px-8 py-3.5 rounded-lg font-medium text-base hover:bg-white/10 transition"
      >
        Learn More
      </a>
    </div>

    <!-- Stats -->
    <div
      class="hero-stats mt-16 grid grid-cols-2 md:grid-cols-4 gap-6 max-w-3xl mx-auto border-t border-white/10 pt-10 opacity-0 translate-y-5"
    >
      <div class="text-center">
        <div class="text-3xl md:text-4xl font-bold text-blue-500">16</div>
        <div class="text-xs md:text-sm uppercase tracking-wider text-white/60 mt-1">
          Workshops
        </div>
      </div>

      <div class="text-center">
        <div class="text-3xl md:text-4xl font-bold text-blue-500">9</div>
        <div class="text-xs md:text-sm uppercase tracking-wider text-white/60 mt-1">
          Regions
        </div>
      </div>

      <div class="text-center">
        <div class="text-3xl md:text-4xl font-bold text-blue-500">15</div>
        <div class="text-xs md:text-sm uppercase tracking-wider text-white/60 mt-1">
          Acquisitions
        </div>
      </div>

      <div class="text-center">
        <div class="text-3xl md:text-4xl font-bold text-blue-500">2024</div>
        <div class="text-xs md:text-sm uppercase tracking-wider text-white/60 mt-1">
          Founded
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll Down -->
  <div
    class="scroll-indicator absolute bottom-8 left-1/2 -translate-x-1/2 opacity-0"
  >
    <a
      href="#about"
      class="text-white/50 hover:text-blue-500 transition animate-bounce"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M19 9l-7 7-7-7"
        />
      </svg>
    </a>
  </div>
</section>
</div>
  </body>
</html>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    // Hero title
    setTimeout(() => {
      const title = document.querySelector(".hero-title");
      title.classList.remove("opacity-0", "translate-y-10");
      title.classList.add("opacity-100", "translate-y-0");
      title.style.transition = "all 0.8s ease-out";
    }, 100);

    // Subtitle
    setTimeout(() => {
      const subtitle = document.querySelector(".hero-subtitle");
      subtitle.classList.remove("opacity-0", "translate-y-8");
      subtitle.classList.add("opacity-100", "translate-y-0");
      subtitle.style.transition = "all 0.8s ease-out";
    }, 300);

    // Buttons
    setTimeout(() => {
      const buttons = document.querySelector(".hero-buttons");
      buttons.classList.remove("opacity-0", "translate-y-5");
      buttons.classList.add("opacity-100", "translate-y-0");
      buttons.style.transition = "all 0.6s ease-out";
    }, 600);

    // Stats
    setTimeout(() => {
      const stats = document.querySelector(".hero-stats");
      stats.classList.remove("opacity-0", "translate-y-5");
      stats.classList.add("opacity-100", "translate-y-0");
      stats.style.transition = "all 0.8s ease-out";
    }, 900);

    // Scroll indicator
    setTimeout(() => {
      const scroll = document.querySelector(".scroll-indicator");
      scroll.classList.remove("opacity-0");
      scroll.classList.add("opacity-100");
      scroll.style.transition = "opacity 0.8s ease";
    }, 1200);
  });
</script>
